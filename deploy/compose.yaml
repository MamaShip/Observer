# Production stack (docs/design.md §13). On the server, next to this file:
#   .env       settings and secrets (from .env.example), mode 600
#   Caddyfile
# Then: docker compose up -d

name: observer

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${DOMAIN:?set DOMAIN in .env}
      SNAP_HOST: snap.${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

  app:
    image: ${OBSERVER_IMAGE:-ghcr.io/mamaship/observer:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://observer:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/observer?sslmode=disable
      BASE_URL: https://${DOMAIN}
      SNAP_BASE_URL: https://snap.${DOMAIN}
      TRUST_PROXY_HEADERS: "true"
      CACHE_DIR: /cache
      GOMEMLIMIT: 200MiB
    volumes:
      - cache:/cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "observer", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: observer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: observer
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
      - -c
      - wal_buffers=4MB
      - -c
      - max_wal_size=512MB
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observer -d observer"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128m
    deploy:
      resources:
        limits:
          memory: 320m
    logging: *logging

volumes:
  pgdata:
  cache:
  caddy_data:
  caddy_config:
