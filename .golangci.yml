version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # Close/Write errors on these are either meaningless (read side,
      # response already committed) or surface on the next operation.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (net.Conn).Close
        - (*net/http.Response).Body.Close
        - (*compress/gzip.Reader).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*database/sql.DB).Close
        - (net/http.ResponseWriter).Write
        - (*flag.FlagSet).Parse
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/MamaShip/Observer
