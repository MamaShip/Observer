name: CI

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: observer
          POSTGRES_PASSWORD: observer
          POSTGRES_DB: observer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observer -d observer"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://observer:observer@localhost:5432/observer?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: sqlc generated code is up to date
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"
      - run: sqlc diff

      - name: go mod tidy is clean
        run: go mod tidy -diff

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: go build -o /dev/null ./cmd/observer

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: npm ci

      # From the repository root: web/ has its own go.mod (it keeps Go
      # tooling out of node_modules), so `go run ../cmd/...` fails from here.
      - name: API types are up to date
        run: |
          (cd .. && go run ./cmd/observer openapi) > openapi.json
          npm run openapi
          git diff --exit-code src/api/schema.d.ts

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build
